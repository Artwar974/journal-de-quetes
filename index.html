<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#07101f">
  <title>APP TDAH — Environnement ATHENA</title>
  <style>
    :root {
      color-scheme: dark;
      --ink: #f8f1de;
      --accent: #ffd898;
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      overflow: hidden;
      background: #050914;
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      display: grid;
      place-items: center;
      isolation: isolate;
    }

    .ambient {
      position: fixed;
      inset: -20%;
      z-index: -2;
      background:
        radial-gradient(circle at 48% 38%, color-mix(in srgb, var(--accent) 22%, transparent), transparent 42%),
        linear-gradient(160deg, #11192f, #040711 62%);
      transition: background 1.4s ease;
    }

    .stage-shell {
      position: relative;
      width: min(100vw, calc(100vh * 720 / 1280));
      height: min(100vh, calc(100vw * 1280 / 720));
      overflow: hidden;
      background: #11182c;
      box-shadow: 0 0 0 1px rgba(255,255,255,.1), 0 32px 90px rgba(0,0,0,.72);
    }

    /* Les téléphones modernes sont plus longs que le ratio de la composition.
       On remplit alors tout le viewport et on recadre doucement les côtés,
       plutôt que de laisser une bande vide sous la scène. */
    @media (max-width: 600px) and (orientation: portrait) {
      html, body { min-height: 100vh; height: 100vh; min-height: 100dvh; height: 100dvh; }
      .stage-shell {
        width: 100vw;
        height: 100vh;
        height: 100dvh;
        max-height: 100vh;
        max-height: 100dvh;
        box-shadow: none;
      }
      .stage-shell > canvas {
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: center;
      }
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    .loading {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      background: #0a1224;
      color: rgba(255,255,255,.72);
      font-size: 11px;
      letter-spacing: .12em;
      text-transform: uppercase;
      transition: opacity .5s ease;
    }
    .loading.done { opacity: 0; pointer-events: none; }

    @media (min-width: 840px) {
      .stage-shell { border-radius: 22px; max-height: calc(100vh - 30px); }
    }

    @media (prefers-reduced-motion: reduce) {
      .ambient, .loading { transition: none; }
    }
  </style>
</head>
<body>
  <div class="ambient" aria-hidden="true"></div>
  <main class="stage-shell" aria-label="Environnement ATHENA synchronisé avec l’heure locale">
    <canvas id="scene" width="720" height="1280"></canvas>
    <div class="loading" id="loading">Préparation des états lumineux…</div>
  </main>

  <script>
    // La vidéo source est en 720 × 1280. Travailler directement à cette
    // définition évite de suréchantillonner six canevas plein écran sans
    // apporter de détail visible sur téléphone.
    const W = 720;
    const H = 1280;
    const DESIGN_W = 941;
    const DESIGN_H = 1672;
    const SCALE = W / DESIGN_W;
    const waterGeometry = {
      horizon: Math.round(H * 498 / DESIGN_H),
      bottom: Math.round(H * 1011 / DESIGN_H)
    };
    const WATER_H = waterGeometry.bottom - waterGeometry.horizon;
    const canvas = document.querySelector('#scene');
    // Le mode desynchronized autorise une présentation avant la fin du dessin
    // et provoquait du tearing perceptible comme un clignotement rapide.
    const ctx = canvas.getContext('2d', { alpha: false });
    const effectCanvas = document.createElement('canvas');
    effectCanvas.width = W;
    effectCanvas.height = H;
    const effectCtx = effectCanvas.getContext('2d');
    const celestialCanvas = document.createElement('canvas');
    celestialCanvas.width = W;
    celestialCanvas.height = H;
    const celestialCtx = celestialCanvas.getContext('2d');
    celestialCtx.imageSmoothingEnabled = true;
    celestialCtx.imageSmoothingQuality = 'high';
    const auraCanvas = document.createElement('canvas');
    auraCanvas.width = W;
    auraCanvas.height = H;
    const auraCtx = auraCanvas.getContext('2d');
    const oceanVideoCanvas = document.createElement('canvas');
    oceanVideoCanvas.width = W;
    oceanVideoCanvas.height = WATER_H;
    const oceanVideoCtx = oceanVideoCanvas.getContext('2d');
    const baseSceneCanvas = document.createElement('canvas');
    baseSceneCanvas.width = W;
    baseSceneCanvas.height = H;
    const baseSceneCtx = baseSceneCanvas.getContext('2d');
    const foregroundSceneCanvas = document.createElement('canvas');
    foregroundSceneCanvas.width = W;
    foregroundSceneCanvas.height = H;
    const foregroundSceneCtx = foregroundSceneCanvas.getContext('2d');
    const waterDepthCanvas = document.createElement('canvas');
    waterDepthCanvas.width = W;
    waterDepthCanvas.height = WATER_H;
    const waterDepthCtx = waterDepthCanvas.getContext('2d');
    const reflectionCanvas = document.createElement('canvas');
    reflectionCanvas.width = W;
    reflectionCanvas.height = WATER_H;
    const reflectionCtx = reflectionCanvas.getContext('2d');
    const loading = document.querySelector('#loading');

    const reducedMotionQuery = window.matchMedia('(prefers-reduced-motion: reduce)');
    const localFileMode = window.location.protocol === 'file:';
    const oceanVideo = document.createElement('video');
    oceanVideo.src = 'assets/LOOP_EAU.mp4?v=original-cycle-restored-20260902';
    oceanVideo.loop = false;
    oceanVideo.muted = true;
    oceanVideo.playsInline = true;
    oceanVideo.preload = 'auto';
    oceanVideo.hidden = true;
    oceanVideo.setAttribute('aria-hidden', 'true');
    document.body.appendChild(oceanVideo);
    oceanVideo.autoplay = true;
    oceanVideo.id = 'oceanVideoSource';
    const oceanVideoRelay = document.createElement('video');
    oceanVideoRelay.src = oceanVideo.src;
    oceanVideoRelay.loop = false;
    oceanVideoRelay.muted = true;
    oceanVideoRelay.playsInline = true;
    oceanVideoRelay.preload = 'auto';
    oceanVideoRelay.hidden = true;
    oceanVideoRelay.setAttribute('aria-hidden', 'true');
    document.body.appendChild(oceanVideoRelay);
    let oceanVideoReady = false;
    let oceanVideoRelayReady = false;
    let oceanFrameCached = false;
    let activeOceanVideo = oceanVideo;
    let relayOceanVideo = oceanVideoRelay;
    let oceanHandoffStartedAt = 0;
    let oceanHandoffActive = false;
    let oceanHandoffPending = false;
    const oceanHandoffLead = .24;
    const oceanHandoffDuration = 190;

    const celestialProfiles = {
      sun: {
        discRadius: 20 * SCALE,
        innerHalo: 2.2,
        outerHalo: 5.8,
        haloPower: .62,
        rayPower: .52,
        grainPower: .34,
        mapLightPower: 1,
        core: '#fffef3',
        edge: '#ffbd55',
        halo: [255, 174, 86],
        ray: [255, 183, 104]
      },
      moon: {
        discRadius: 24 * SCALE,
        innerHalo: 1.75,
        outerHalo: 3.8,
        haloPower: .34,
        rayPower: .065,
        grainPower: .08,
        mapLightPower: .62,
        core: '#eef5ff',
        edge: '#a9c4ff',
        halo: [145, 180, 255],
        ray: [140, 174, 242]
      }
    };

    const states = [
      { name: 'Lever', file: 'MASTER_SUNRISE_LOCKED.png', hour: 6, accent: '#ffd59f', light: '#ffc991', lightPower: .055, shadowPower: .025 },
      { name: 'Jour', file: 'MASTER_DAYLIGHT_LOCKED.png', hour: 12, accent: '#fff4ce', light: '#fff2cf', lightPower: .025, shadowPower: .012 },
      { name: 'Coucher', file: 'MASTER_SUNSET_LOCKED.png', hour: 18, accent: '#ff9b6f', light: '#ff9b70', lightPower: .065, shadowPower: .042 },
      { name: 'Nuit', file: 'MASTER_NIGHT_LOCKED.png', hour: 0, accent: '#9eb7ff', light: '#9eb8ff', lightPower: .024, shadowPower: .07 }
    ];

    // Horaires par défaut du prototype. Cette configuration est volontairement
    // centralisée pour pouvoir être remplacée plus tard par les heures locales
    // fournies par le téléphone, la date et la position géographique.
    const daylightSchedule = {
      dawnStart: 5.75,
      sunriseStart: 6,
      dayStart: 8,
      sunsetStart: 18.5,
      nightStart: 20.75,
      sunRise: 6.75,
      sunSet: 20.15,
      moonRise: 20,
      moonSet: 6.25
    };

    // Les paliers préservent longtemps les états stables et concentrent les
    // transitions chromatiques autour des heures où elles ont réellement lieu.
    const visualAnchors = [
      { hour: 0, state: 3 },
      { hour: daylightSchedule.dawnStart, state: 3 },
      { hour: 6.5, state: 0 },
      { hour: 7.5, state: 0 },
      { hour: 8.5, state: 1 },
      { hour: 18.25, state: 1 },
      { hour: 19, state: 2 },
      { hour: 20, state: 2 },
      { hour: 21, state: 3 },
      { hour: 24, state: 3 }
    ];

    const assets = {};
    let animationClock = 0;
    let nextFrameAt = 0;
    let lastLightingUpdate = -Infinity;
    let litBaseSceneReady = false;
    let lastWaterDepthUpdate = -Infinity;
    let waterDepthReady = false;
    const targetFrameDuration = 1000 / 24;
    const stabilizedCelestialPositions = { sun: null, moon: null };

    function loadImage(src) {
      return new Promise((resolve, reject) => {
        const image = new Image();
        image.decoding = 'async';
        image.onload = () => resolve(image);
        image.onerror = () => reject(new Error(`Source visuelle introuvable ou illisible : assets/${src}`));
        image.src = new URL(`assets/${src}`, document.baseURI).href;
      });
    }

    function smootherStep(t) {
      return t * t * t * (t * (t * 6 - 15) + 10);
    }

    function mix(a, b, t) { return a + (b - a) * t; }

    function clamp(value, min = 0, max = 1) {
      return Math.min(max, Math.max(min, value));
    }

    function smoothRange(edge0, edge1, value) {
      const t = clamp((value - edge0) / (edge1 - edge0));
      return smootherStep(t);
    }

    function hexToRgb(hex) {
      const n = parseInt(hex.slice(1), 16);
      return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
    }

    function mixColor(a, b, t) {
      const ca = hexToRgb(a);
      const cb = hexToRgb(b);
      return `rgb(${Math.round(mix(ca[0], cb[0], t))} ${Math.round(mix(ca[1], cb[1], t))} ${Math.round(mix(ca[2], cb[2], t))})`;
    }

    function createLuminanceMask(image, invert = false) {
      const source = document.createElement('canvas');
      source.width = W;
      source.height = H;
      const sourceCtx = source.getContext('2d', { willReadFrequently: true });
      sourceCtx.drawImage(image, 0, 0, W, H);
      const pixels = sourceCtx.getImageData(0, 0, W, H);
      const data = pixels.data;
      for (let i = 0; i < data.length; i += 4) {
        const luma = Math.round(data[i] * .2126 + data[i + 1] * .7152 + data[i + 2] * .0722);
        data[i] = 255;
        data[i + 1] = 255;
        data[i + 2] = 255;
        data[i + 3] = invert ? 255 - luma : luma;
      }
      sourceCtx.putImageData(pixels, 0, 0);
      return source;
    }

    function createAlphaSampler(image) {
      const source = document.createElement('canvas');
      source.width = W;
      source.height = H;
      const sourceCtx = source.getContext('2d', { willReadFrequently: true });
      sourceCtx.drawImage(image, 0, 0, W, H);
      return sourceCtx.getImageData(0, 0, W, H).data;
    }

    function combineAlphaLayers(...images) {
      const combined = document.createElement('canvas');
      combined.width = W;
      combined.height = H;
      const combinedCtx = combined.getContext('2d');
      combinedCtx.globalCompositeOperation = 'source-over';
      for (const image of images) combinedCtx.drawImage(image, 0, 0, W, H);
      return combined;
    }

    function excludeMaskFromLayer(layer, excludedMask) {
      const solidOnly = document.createElement('canvas');
      solidOnly.width = W;
      solidOnly.height = H;
      const solidCtx = solidOnly.getContext('2d');
      solidCtx.globalCompositeOperation = 'source-over';
      solidCtx.drawImage(layer, 0, 0, W, H);
      // Les PNG de composition contiennent également des pixels de mer.
      // On les retire du calque d'occlusion pour éviter tout grand rectangle
      // translucide replacé au-dessus de l'animation marine.
      solidCtx.globalCompositeOperation = 'destination-out';
      solidCtx.drawImage(excludedMask, 0, 0, W, H);
      return solidOnly;
    }

    function clipAlphaLayerToBand(image, top, bottom) {
      const clipped = document.createElement('canvas');
      clipped.width = W;
      clipped.height = H;
      const clippedCtx = clipped.getContext('2d');
      clippedCtx.drawImage(
        image,
        0, top, W, bottom - top,
        0, top, W, bottom - top
      );
      return clipped;
    }

    function sampleMaskCoverage(alphaPixels, x, y, radius = 0) {
      if (!alphaPixels) return 0;
      const offsets = radius > 1
        ? [[0,0],[-.55,0],[.55,0],[0,-.55],[0,.55],[-.38,-.38],[.38,-.38],[-.38,.38],[.38,.38]]
        : [[0,0]];
      let total = 0;
      for (const [ox, oy] of offsets) {
        const px = Math.round(clamp(x + ox * radius, 0, W - 1));
        const py = Math.round(clamp(y + oy * radius, 0, H - 1));
        total += alphaPixels[(py * W + px) * 4 + 3] / 255;
      }
      return total / offsets.length;
    }

    function paintMaskedColor(mask, color, alpha, composite) {
      if (!mask || alpha <= .001) return;
      effectCtx.globalCompositeOperation = 'source-over';
      effectCtx.clearRect(0, 0, W, H);
      effectCtx.fillStyle = color;
      effectCtx.fillRect(0, 0, W, H);
      effectCtx.globalCompositeOperation = 'destination-in';
      effectCtx.drawImage(mask, 0, 0);
      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.globalCompositeOperation = composite;
      ctx.drawImage(effectCanvas, 0, 0);
      ctx.restore();
    }

    function captureLitBaseScene() {
      baseSceneCtx.globalCompositeOperation = 'source-over';
      baseSceneCtx.globalAlpha = 1;
      baseSceneCtx.clearRect(0, 0, W, H);
      baseSceneCtx.drawImage(canvas, 0, 0);

      // Le premier plan ne change qu'avec l'éclairage (une fois par seconde),
      // pas avec chaque image de la mer. On le prépare donc une seule fois ici.
      foregroundSceneCtx.globalCompositeOperation = 'source-over';
      foregroundSceneCtx.globalAlpha = 1;
      foregroundSceneCtx.clearRect(0, 0, W, H);
      foregroundSceneCtx.drawImage(baseSceneCanvas, 0, 0);
      foregroundSceneCtx.globalCompositeOperation = 'destination-in';
      foregroundSceneCtx.drawImage(assets.sceneForegroundOcclusion, 0, 0, W, H);
      foregroundSceneCtx.globalCompositeOperation = 'source-over';
    }

    function restoreForegroundLayers() {
      ctx.save();
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      ctx.drawImage(foregroundSceneCanvas, 0, 0);
      ctx.restore();
    }

    function paintDirectionalLight(mask, celestial) {
      if (!mask || !celestial || celestial.visibility <= .001) return;
      effectCtx.globalCompositeOperation = 'source-over';
      effectCtx.clearRect(0, 0, W, H);
      const radius = celestial.kind === 'sun' ? W * .92 : W * .72;
      const gradient = effectCtx.createRadialGradient(
        celestial.x, celestial.y, 8,
        celestial.x, celestial.y, radius
      );
      gradient.addColorStop(0, celestial.lightColor);
      gradient.addColorStop(.34, celestial.lightColor);
      gradient.addColorStop(1, 'rgba(0,0,0,0)');
      effectCtx.fillStyle = gradient;
      effectCtx.fillRect(0, 0, W, H);
      effectCtx.globalCompositeOperation = 'destination-in';
      effectCtx.drawImage(mask, 0, 0);

      ctx.save();
      ctx.globalAlpha = celestial.lightPower * celestial.profile.mapLightPower * celestial.directVisibility;
      ctx.globalCompositeOperation = 'screen';
      ctx.drawImage(effectCanvas, 0, 0);
      ctx.restore();
    }

    function syncOceanVideoPlayback() {
      if (!oceanVideoReady) return;
      if (reducedMotionQuery.matches) {
        activeOceanVideo.pause();
        relayOceanVideo.pause();
        activeOceanVideo.currentTime = 0;
        relayOceanVideo.currentTime = 0;
        oceanHandoffActive = false;
        oceanHandoffPending = false;
        return;
      }
      activeOceanVideo.play().catch(() => {});
    }

    function updateOceanVideoHandoff() {
      if (!oceanVideoReady || !oceanVideoRelayReady || reducedMotionQuery.matches) return 0;
      const duration = activeOceanVideo.duration;
      if (!Number.isFinite(duration) || duration <= oceanHandoffLead) return 0;

      if (!oceanHandoffActive && !oceanHandoffPending && activeOceanVideo.currentTime >= duration - oceanHandoffLead) {
        oceanHandoffPending = true;
        relayOceanVideo.currentTime = 0;
        relayOceanVideo.play().then(() => {
          oceanHandoffStartedAt = performance.now();
          oceanHandoffActive = true;
          oceanHandoffPending = false;
        }).catch(() => {
          oceanHandoffPending = false;
        });
      }

      if (!oceanHandoffActive) return 0;
      const blend = clamp((performance.now() - oceanHandoffStartedAt) / oceanHandoffDuration);
      if (blend >= 1) {
        activeOceanVideo.pause();
        activeOceanVideo.currentTime = 0;
        const previousVideo = activeOceanVideo;
        activeOceanVideo = relayOceanVideo;
        relayOceanVideo = previousVideo;
        oceanHandoffActive = false;
        oceanHandoffPending = false;
        return 0;
      }
      return blend;
    }

    function drawAnimatedOcean(hour) {
      const { sunset, night } = waterPalette(hour);

      // Au raccord de boucle, le lecteur peut perdre son état « prêt » pendant
      // une ou deux images. On conserve alors la dernière frame valide au lieu
      // de retirer brutalement toute la couche lumineuse de la mer.
      const requestedRelayBlend = updateOceanVideoHandoff();
      if (oceanVideoReady && activeOceanVideo.readyState >= 2) {
        // Le fondu ne commence qu'après réception d'une vraie image du relais.
        // Sinon l'ancienne frame perdait déjà son opacité, ce qui produisait
        // précisément la disparition/réapparition observée sur certains cycles.
        const relayDrawable = requestedRelayBlend > 0
          && relayOceanVideo.readyState >= 2
          && !relayOceanVideo.paused;
        const relayBlend = relayDrawable ? requestedRelayBlend : 0;
        oceanVideoCtx.globalCompositeOperation = 'source-over';
        oceanVideoCtx.clearRect(0, 0, W, WATER_H);
        oceanVideoCtx.globalAlpha = 1 - relayBlend;
        oceanVideoCtx.drawImage(
          activeOceanVideo,
          0, waterGeometry.horizon, W, WATER_H,
          0, 0, W, WATER_H
        );
        if (relayDrawable) {
          // Addition pondérée : les deux contributions totalisent toujours 1,
          // donc le raccord ne provoque ni baisse de luminosité ni flash.
          oceanVideoCtx.globalCompositeOperation = 'lighter';
          oceanVideoCtx.globalAlpha = relayBlend;
          oceanVideoCtx.drawImage(
            relayOceanVideo,
            0, waterGeometry.horizon, W, WATER_H,
            0, 0, W, WATER_H
          );
        }
        oceanVideoCtx.globalAlpha = 1;
        oceanVideoCtx.globalCompositeOperation = 'source-over';
        oceanVideoCtx.globalCompositeOperation = 'destination-in';
        oceanVideoCtx.drawImage(
          assets.waterMask,
          0, waterGeometry.horizon, W, WATER_H,
          0, 0, W, WATER_H
        );
        oceanFrameCached = true;
      }
      if (!oceanFrameCached) return;

      // La vidéo fournit le mouvement et les valeurs lumineuses, tandis que
      // les masters conservent la colorimétrie propre à l'heure courante.
      ctx.save();
      ctx.globalCompositeOperation = 'luminosity';
      ctx.globalAlpha = night ? .3 : sunset ? .56 : .7;
      ctx.drawImage(oceanVideoCanvas, 0, waterGeometry.horizon);
      ctx.globalCompositeOperation = 'soft-light';
      ctx.globalAlpha = night ? .18 : sunset ? .28 : .34;
      ctx.drawImage(oceanVideoCanvas, 0, waterGeometry.horizon);
      ctx.restore();
    }

    function drawWaterDepthGradient(hour) {
      const { sunset, night } = waterPalette(hour);
      if (!waterDepthReady || animationClock - lastWaterDepthUpdate >= 1000) {
        waterDepthCtx.globalCompositeOperation = 'source-over';
        waterDepthCtx.globalAlpha = 1;
        waterDepthCtx.clearRect(0, 0, W, WATER_H);

        const depthGradient = waterDepthCtx.createLinearGradient(0, 0, 0, WATER_H);
        depthGradient.addColorStop(0, 'rgba(8,18,42,0)');
        depthGradient.addColorStop(.38, 'rgba(8,18,42,.04)');
        depthGradient.addColorStop(.72, 'rgba(5,13,34,.18)');
        depthGradient.addColorStop(1, `rgba(3,9,27,${night ? .46 : sunset ? .38 : .32})`);
        waterDepthCtx.fillStyle = depthGradient;
        waterDepthCtx.fillRect(0, 0, W, WATER_H);
        waterDepthCtx.globalCompositeOperation = 'destination-in';
        waterDepthCtx.drawImage(
          assets.waterEffectMask,
          0, waterGeometry.horizon, W, WATER_H,
          0, 0, W, WATER_H
        );
        waterDepthCtx.globalCompositeOperation = 'source-over';
        lastWaterDepthUpdate = animationClock;
        waterDepthReady = true;
      }

      ctx.save();
      ctx.globalCompositeOperation = 'multiply';
      ctx.globalAlpha = 1;
      ctx.drawImage(waterDepthCanvas, 0, waterGeometry.horizon);
      ctx.restore();
    }

    function waterPalette(hour) {
      const sunset = hour >= 17.5 && hour <= 21.1
        ? Math.sin(clamp((hour - 17.5) / 3.6) * Math.PI)
        : 0;
      const night = hour >= 20.75 || hour < 6
        ? 1
        : hour < 8 ? 1 - smoothRange(6, 8, hour)
        : hour > 18.5 ? smoothRange(18.5, 20.75, hour)
        : 0;
      return { sunset, night };
    }

    function hoursSince(startHour, hour) {
      return (hour - startHour + 24) % 24;
    }

    function getVisualBlend(hour) {
      const normalizedHour = ((hour % 24) + 24) % 24;
      for (let index = 0; index < visualAnchors.length - 1; index++) {
        const from = visualAnchors[index];
        const to = visualAnchors[index + 1];
        if (normalizedHour >= from.hour && normalizedHour <= to.hour) {
          const duration = Math.max(.001, to.hour - from.hour);
          const rawT = clamp((normalizedHour - from.hour) / duration);
          return {
            current: states[from.state],
            next: states[to.state],
            easedT: from.state === to.state ? 0 : smootherStep(rawT)
          };
        }
      }
      return { current: states[3], next: states[3], easedT: 0 };
    }

    function orbit(t, startX, endX, horizonY, apexY) {
      return {
        x: mix(startX, endX, t) * W,
        y: (horizonY - (horizonY - apexY) * 4 * t * (1 - t)) * H
      };
    }

    function stabilizeCelestialPosition(celestial) {
      const target = { x: celestial.x, y: celestial.y };
      let stable = stabilizedCelestialPositions[celestial.kind];
      if (!stable) {
        stable = { ...target };
        stabilizedCelestialPositions[celestial.kind] = stable;
      } else {
        // La lune se déplace de quelques centièmes de pixel par seconde. Cet
        // amortissement répartit les changements de couverture des pixels sur
        // plusieurs frames et absorbe aussi les micro-corrections de l'horloge.
        const response = celestial.kind === 'moon' ? .065 : .11;
        stable.x += (target.x - stable.x) * response;
        stable.y += (target.y - stable.y) * response;
      }
      celestial.x = stable.x;
      celestial.y = stable.y;
      return celestial;
    }

    function getCelestials(hour) {
      const celestials = [];

      // La course déborde légèrement des deux côtés du cadre. Son arc plus
      // bas et plus large évite l'effet de cloche tout en gardant le coucher
      // pleinement visible sur la gauche.
      const sunElapsed = hoursSince(daylightSchedule.sunRise, hour);
      const sunDuration = daylightSchedule.sunSet - daylightSchedule.sunRise;
      if (sunElapsed <= sunDuration) {
        const t = sunElapsed / sunDuration;
        const point = orbit(t, 1.08, -.08, .305, .085);
        const fadeIn = smoothRange(0, .08, t);
        const fadeOut = 1 - smoothRange(.88, .98, t);
        const horizonFactor = Math.pow(Math.abs(t - .5) * 2, 1.4);
        const sunsetBias = smoothRange(.58, .96, t);
        celestials.push({
          kind: 'sun',
          profile: celestialProfiles.sun,
          x: point.x,
          y: point.y,
          t,
          altitude: Math.sin(Math.PI * t),
          horizonFactor,
          sunsetBias,
          visibility: fadeIn * fadeOut,
          image: assets.sun,
          size: mix(104, 132, horizonFactor) * SCALE,
          lightColor: sunsetBias > .1 ? 'rgba(255,132,69,.96)' : 'rgba(255,239,197,.86)',
          lightPower: .018 + .066 * horizonFactor * (.35 + .65 * sunsetBias),
          reflectionColor: sunsetBias > .1 ? 'rgba(255,177,104,.92)' : 'rgba(255,244,208,.72)',
          reflectionPower: .10 + .31 * horizonFactor * sunsetBias
        });
      }

      const moonElapsed = hoursSince(daylightSchedule.moonRise, hour);
      const moonDuration = hoursSince(daylightSchedule.moonRise, daylightSchedule.moonSet);
      if (moonElapsed <= moonDuration) {
        const t = moonElapsed / moonDuration;
        const point = orbit(t, 1.08, -.08, .295, .095);
        const fadeIn = smoothRange(0, .08, t);
        const fadeOut = 1 - smoothRange(.88, .98, t);
        const altitude = Math.sin(Math.PI * t);
        celestials.push({
          kind: 'moon',
          profile: celestialProfiles.moon,
          x: point.x,
          y: point.y,
          t,
          altitude,
          horizonFactor: 1 - altitude,
          sunsetBias: 0,
          visibility: fadeIn * fadeOut,
          image: assets.moon,
          size: mix(102, 116, altitude) * SCALE,
          lightColor: 'rgba(151,183,255,.88)',
          lightPower: .022 + .026 * altitude,
          reflectionColor: 'rgba(174,201,255,.9)',
          reflectionPower: .22 + .16 * altitude
        });
      }

      for (const kind of ['sun', 'moon']) {
        if (!celestials.some(item => item.kind === kind)) {
          stabilizedCelestialPositions[kind] = null;
        }
      }

      // Quand le centre de l'astre passe derrière le mont, sa contribution
      // directe à la carte et à la mer s'éteint progressivement. Les halos et
      // le disque restent, eux, découpés précisément par le masque visuel.
      for (const celestial of celestials) {
        stabilizeCelestialPosition(celestial);
        celestial.occlusion = sampleMaskCoverage(
          assets.mountainSampler,
          celestial.x,
          celestial.y,
          celestial.profile.discRadius * 1.25
        );
        celestial.directVisibility = celestial.visibility * (1 - celestial.occlusion * .97);
      }

      return celestials;
    }

    function drawWaterReflection(celestial) {
      if (!celestial || celestial.visibility <= .01) return;
      reflectionCtx.globalCompositeOperation = 'source-over';
      reflectionCtx.clearRect(0, 0, W, WATER_H);
      reflectionCtx.fillStyle = celestial.reflectionColor;

      const xOrigin = celestial.x;
      const reflectionDepths = [.01, .055, .12, .21, .32, .45, .61, .79, .98];
      for (let index = 0; index < reflectionDepths.length; index++) {
        const depth = reflectionDepths[index];
        const y = depth * (438 * SCALE) + Math.sin(animationClock * .0012 + index * 1.7) * ((1 + depth * 3) * SCALE);
        const spread = (10 + depth * 104) * SCALE;
        const drift = Math.sin(index * 2.13 + animationClock * .00065) * spread * .29;
        const width = spread * (.38 + .62 * Math.sin(index * 2.8 + 1.2) ** 2);
        const height = (1.7 + depth * 3.5) * SCALE;
        reflectionCtx.globalAlpha = (1 - depth * .48) * (.32 + .38 * Math.sin(index * 1.91) ** 2);
        reflectionCtx.beginPath();
        reflectionCtx.ellipse(xOrigin + drift, y, width, height, 0, 0, Math.PI * 2);
        reflectionCtx.fill();
      }

      reflectionCtx.globalAlpha = 1;
      reflectionCtx.globalCompositeOperation = 'destination-in';
      reflectionCtx.drawImage(
        assets.waterMask,
        0, waterGeometry.horizon, W, WATER_H,
        0, 0, W, WATER_H
      );

      // Le reflet reste pleinement présent près de l'horizon, puis se fond
      // progressivement dans la matière de l'eau en allant vers le premier plan.
      const reflectionFade = reflectionCtx.createLinearGradient(
        0,
        0,
        0,
        WATER_H
      );
      reflectionFade.addColorStop(0, 'rgba(255,255,255,1)');
      reflectionFade.addColorStop(.28, 'rgba(255,255,255,.88)');
      reflectionFade.addColorStop(.68, 'rgba(255,255,255,.38)');
      reflectionFade.addColorStop(1, 'rgba(255,255,255,.05)');
      reflectionCtx.fillStyle = reflectionFade;
      reflectionCtx.fillRect(0, 0, W, WATER_H);

      ctx.save();
      ctx.globalCompositeOperation = 'screen';
      ctx.globalAlpha = celestial.reflectionPower * celestial.directVisibility;
      ctx.drawImage(reflectionCanvas, 0, waterGeometry.horizon);
      ctx.restore();
    }

    function seededNoise(index, seed = 0) {
      const x = Math.sin(index * 127.1 + seed * 311.7) * 43758.5453;
      return x - Math.floor(x);
    }

    function occultAuraLayer() {
      auraCtx.globalAlpha = 1;
      auraCtx.filter = 'none';
      auraCtx.globalCompositeOperation = 'destination-out';
      auraCtx.drawImage(assets.mountainOcclusion, 0, 0, W, H);
      auraCtx.globalCompositeOperation = 'source-over';
    }

    function drawRayFan(celestial, intensity) {
      if (intensity <= .002) return;
      const { profile } = celestial;
      const baseAngle = Math.atan2(H * .52 - celestial.y, W * .5 - celestial.x);
      const spread = celestial.kind === 'sun' ? .7 : .42;
      const length = celestial.kind === 'sun' ? H * .98 : H * .62;
      const motion = reducedMotionQuery.matches ? 0 : animationClock * .000035;

      auraCtx.save();
      auraCtx.globalCompositeOperation = 'screen';
      auraCtx.filter = celestial.kind === 'sun' ? 'blur(18px)' : 'blur(24px)';
      for (let index = 0; index < 7; index++) {
        const lane = (index / 6 - .5) * spread;
        const flutter = Math.sin(index * 2.7 + motion) * .025;
        const angle = baseAngle + lane + flutter;
        const width = (.055 + seededNoise(index, 2) * .055) * length;
        const endX = celestial.x + Math.cos(angle) * length;
        const endY = celestial.y + Math.sin(angle) * length;
        const gradient = auraCtx.createLinearGradient(celestial.x, celestial.y, endX, endY);
        const [r, g, b] = profile.ray;
        const laneAlpha = intensity * (.34 + seededNoise(index, 4) * .42);
        gradient.addColorStop(0, `rgba(${r},${g},${b},${laneAlpha})`);
        gradient.addColorStop(.22, `rgba(${r},${g},${b},${laneAlpha * .54})`);
        gradient.addColorStop(1, `rgba(${r},${g},${b},0)`);
        auraCtx.fillStyle = gradient;
        auraCtx.beginPath();
        auraCtx.moveTo(celestial.x, celestial.y);
        auraCtx.lineTo(endX + Math.cos(angle + Math.PI / 2) * width, endY + Math.sin(angle + Math.PI / 2) * width);
        auraCtx.lineTo(endX - Math.cos(angle + Math.PI / 2) * width, endY - Math.sin(angle + Math.PI / 2) * width);
        auraCtx.closePath();
        auraCtx.fill();
      }
      auraCtx.restore();
    }

    function drawHalos(celestial, intensity) {
      const { profile } = celestial;
      const radius = profile.discRadius * mix(1.04, 1.18, celestial.horizonFactor);
      const [r, g, b] = profile.halo;
      const pulse = reducedMotionQuery.matches ? 1 : 1 + Math.sin(animationClock * .0011 + celestial.t * 5) * .018;

      auraCtx.save();
      auraCtx.globalCompositeOperation = 'screen';
      const outerRadius = radius * profile.outerHalo * pulse;
      const outer = auraCtx.createRadialGradient(celestial.x, celestial.y, radius * .7, celestial.x, celestial.y, outerRadius);
      outer.addColorStop(0, `rgba(${r},${g},${b},${intensity * profile.haloPower * .34})`);
      outer.addColorStop(.34, `rgba(${r},${g},${b},${intensity * profile.haloPower * .17})`);
      outer.addColorStop(1, `rgba(${r},${g},${b},0)`);
      auraCtx.fillStyle = outer;
      auraCtx.fillRect(celestial.x - outerRadius, celestial.y - outerRadius, outerRadius * 2, outerRadius * 2);

      const innerRadius = radius * profile.innerHalo;
      const inner = auraCtx.createRadialGradient(celestial.x, celestial.y, radius * .56, celestial.x, celestial.y, innerRadius);
      inner.addColorStop(0, `rgba(255,255,245,${intensity * profile.haloPower * .48})`);
      inner.addColorStop(.45, `rgba(${r},${g},${b},${intensity * profile.haloPower * .28})`);
      inner.addColorStop(1, `rgba(${r},${g},${b},0)`);
      auraCtx.fillStyle = inner;
      auraCtx.beginPath();
      auraCtx.arc(celestial.x, celestial.y, innerRadius, 0, Math.PI * 2);
      auraCtx.fill();
      auraCtx.restore();
    }

    function drawGlowGrain(celestial, intensity) {
      if (intensity <= .002) return;
      const { profile } = celestial;
      const phase = reducedMotionQuery.matches ? 0 : animationClock * .00012;
      auraCtx.save();
      auraCtx.globalCompositeOperation = 'screen';
      for (let index = 0; index < 38; index++) {
        const angle = seededNoise(index, 7) * Math.PI * 2 + phase * (index % 2 ? 1 : -1);
        const distance = profile.discRadius * (1.15 + seededNoise(index, 9) * 3.15);
        const radius = .45 + seededNoise(index, 11) * 1.25;
        const alpha = intensity * profile.grainPower * (.12 + seededNoise(index, 13) * .46);
        const [r, g, b] = profile.halo;
        auraCtx.fillStyle = `rgba(${r},${g},${b},${alpha})`;
        auraCtx.beginPath();
        auraCtx.arc(celestial.x + Math.cos(angle) * distance, celestial.y + Math.sin(angle) * distance, radius, 0, Math.PI * 2);
        auraCtx.fill();
      }
      auraCtx.restore();
    }

    function drawSolarCorona(celestial, intensity) {
      if (celestial.kind !== 'sun' || intensity <= .002) return;
      const radius = celestial.profile.discRadius * mix(1.04, 1.18, celestial.horizonFactor);
      const phase = reducedMotionQuery.matches ? 0 : animationClock * .000045;
      auraCtx.save();
      auraCtx.translate(celestial.x, celestial.y);
      auraCtx.rotate(phase);
      auraCtx.globalCompositeOperation = 'screen';
      auraCtx.filter = 'blur(1px)';
      for (let index = 0; index < 36; index++) {
        const angle = index / 36 * Math.PI * 2;
        const irregularity = .72 + seededNoise(index, 31) * 1.2;
        const length = radius * (2.2 + irregularity * (1.5 + celestial.horizonFactor * .9));
        const halfWidth = .4 + seededNoise(index, 37) * 1.15;
        const alpha = intensity * (.22 + seededNoise(index, 41) * .18);
        const gradient = auraCtx.createLinearGradient(
          Math.cos(angle) * radius * .7,
          Math.sin(angle) * radius * .7,
          Math.cos(angle) * length,
          Math.sin(angle) * length
        );
        gradient.addColorStop(0, `rgba(255,252,218,${alpha})`);
        gradient.addColorStop(.4, `rgba(255,196,105,${alpha * .66})`);
        gradient.addColorStop(1, 'rgba(255,166,73,0)');
        auraCtx.fillStyle = gradient;
        auraCtx.beginPath();
        auraCtx.moveTo(Math.cos(angle - .04) * radius * .72, Math.sin(angle - .04) * radius * .72);
        auraCtx.lineTo(
          Math.cos(angle) * length + Math.cos(angle + Math.PI / 2) * halfWidth,
          Math.sin(angle) * length + Math.sin(angle + Math.PI / 2) * halfWidth
        );
        auraCtx.lineTo(Math.cos(angle + .04) * radius * .72, Math.sin(angle + .04) * radius * .72);
        auraCtx.closePath();
        auraCtx.fill();
      }

      // Quelques jets plus longs donnent une lecture radiante sans créer une
      // étoile graphique rigide.
      auraCtx.filter = 'blur(2px)';
      for (let index = 0; index < 6; index++) {
        const angle = index / 6 * Math.PI * 2 + .22;
        const length = radius * (6.2 + seededNoise(index, 53) * 3.1);
        const alpha = intensity * (.26 + celestial.horizonFactor * .10);
        const gradient = auraCtx.createLinearGradient(0, 0, Math.cos(angle) * length, Math.sin(angle) * length);
        gradient.addColorStop(0, `rgba(255,244,204,${alpha})`);
        gradient.addColorStop(1, 'rgba(255,176,77,0)');
        auraCtx.strokeStyle = gradient;
        auraCtx.lineWidth = 1.35;
        auraCtx.beginPath();
        auraCtx.moveTo(Math.cos(angle) * radius, Math.sin(angle) * radius);
        auraCtx.lineTo(Math.cos(angle) * length, Math.sin(angle) * length);
        auraCtx.stroke();
      }

      auraCtx.filter = 'none';
      for (let index = 0; index < 4; index++) {
        const angle = index / 4 * Math.PI + phase * .28;
        const length = radius * (8.5 + index * 1.4);
        const gradient = auraCtx.createLinearGradient(
          -Math.cos(angle) * length,
          -Math.sin(angle) * length,
          Math.cos(angle) * length,
          Math.sin(angle) * length
        );
        gradient.addColorStop(0, 'rgba(255,183,82,0)');
        gradient.addColorStop(.43, 'rgba(255,220,151,0)');
        gradient.addColorStop(.5, `rgba(255,255,233,${intensity * .34})`);
        gradient.addColorStop(.57, 'rgba(255,220,151,0)');
        gradient.addColorStop(1, 'rgba(255,183,82,0)');
        auraCtx.strokeStyle = gradient;
        auraCtx.lineWidth = index < 2 ? .9 : .55;
        auraCtx.beginPath();
        auraCtx.moveTo(-Math.cos(angle) * length, -Math.sin(angle) * length);
        auraCtx.lineTo(Math.cos(angle) * length, Math.sin(angle) * length);
        auraCtx.stroke();
      }

      for (let index = 0; index < 12; index++) {
        const angle = index / 12 * Math.PI * 2 - phase * .65;
        const length = radius * (4.2 + seededNoise(index, 67) * 4.8);
        const width = .018 + seededNoise(index, 71) * .026;
        auraCtx.fillStyle = `rgba(255,231,166,${intensity * (.18 + seededNoise(index, 73) * .17)})`;
        auraCtx.beginPath();
        auraCtx.moveTo(Math.cos(angle - width) * radius * 1.12, Math.sin(angle - width) * radius * 1.12);
        auraCtx.lineTo(Math.cos(angle) * length, Math.sin(angle) * length);
        auraCtx.lineTo(Math.cos(angle + width) * radius * 1.12, Math.sin(angle + width) * radius * 1.12);
        auraCtx.closePath();
        auraCtx.fill();
      }
      auraCtx.restore();
    }

    function drawCelestialDisc(celestial) {
      const { profile } = celestial;
      const radius = profile.discRadius * mix(1.04, 1.18, celestial.horizonFactor);
      celestialCtx.save();
      celestialCtx.globalAlpha = celestial.visibility;
      celestialCtx.globalCompositeOperation = 'source-over';

      if (celestial.kind === 'moon') {
        // Le modèle fourni contient déjà sa matière et son halo diffus : on le
        // dessine entier pour ne plus écraser ses détails dans un cercle forcé.
        const box = radius * 2.6;
        celestialCtx.drawImage(
          celestial.image,
          celestial.x - box / 2,
          celestial.y - box / 2,
          box,
          box
        );
        celestialCtx.restore();
        return;
      }

      celestialCtx.beginPath();
      celestialCtx.arc(celestial.x, celestial.y, radius, 0, Math.PI * 2);
      celestialCtx.clip();

      const disc = celestialCtx.createRadialGradient(
        celestial.x - radius * .22, celestial.y - radius * .26, radius * .08,
        celestial.x, celestial.y, radius
      );
      disc.addColorStop(0, profile.core);
      disc.addColorStop(.32, '#fff7cf');
      disc.addColorStop(.72, '#ffd27a');
      disc.addColorStop(1, profile.edge);
      celestialCtx.fillStyle = disc;
      celestialCtx.fillRect(celestial.x - radius, celestial.y - radius, radius * 2, radius * 2);
      celestialCtx.restore();
    }

    function drawCelestialSystem(celestial) {
      if (!celestial || celestial.visibility <= .001) return;
      const horizonBoost = celestial.kind === 'sun'
        ? mix(.72, 1.34, celestial.horizonFactor) * mix(.82, 1.18, celestial.sunsetBias)
        : mix(.72, .96, celestial.altitude);
      const intensity = celestial.visibility * horizonBoost;

      auraCtx.globalCompositeOperation = 'source-over';
      auraCtx.filter = 'none';
      auraCtx.clearRect(0, 0, W, H);
      const lineOfSight = celestial.visibility > .001
        ? clamp(celestial.directVisibility / celestial.visibility)
        : 0;
      const rayIntensity = intensity
        * celestial.profile.rayPower
        * (celestial.kind === 'sun' ? mix(.36, 1.28, celestial.horizonFactor) : 1)
        * lineOfSight;
      drawRayFan(celestial, rayIntensity);
      drawHalos(celestial, intensity);
      drawSolarCorona(celestial, intensity);
      drawGlowGrain(celestial, intensity);
      occultAuraLayer();

      ctx.save();
      ctx.globalCompositeOperation = 'screen';
      ctx.drawImage(auraCanvas, 0, 0);
      ctx.restore();

      celestialCtx.globalCompositeOperation = 'source-over';
      celestialCtx.clearRect(0, 0, W, H);
      drawCelestialDisc(celestial);

      // Le mont reste au premier plan : l’astre disparaît réellement derrière sa silhouette.
      celestialCtx.globalAlpha = 1;
      celestialCtx.globalCompositeOperation = 'destination-out';
      celestialCtx.drawImage(assets.mountainOcclusion, 0, 0, W, H);

      ctx.save();
      ctx.globalCompositeOperation = 'source-over';
      ctx.drawImage(celestialCanvas, 0, 0);
      ctx.restore();
    }

    function getLocalHour() {
      const now = new Date();
      return now.getHours() + now.getMinutes() / 60 + now.getSeconds() / 3600 + now.getMilliseconds() / 3600000;
    }

    function rebuildLitBaseScene(hour) {
      const { current, next, easedT } = getVisualBlend(hour);
      ctx.globalCompositeOperation = 'source-over';
      ctx.globalAlpha = 1;
      ctx.drawImage(assets[current.file], 0, 0, W, H);
      ctx.globalAlpha = easedT;
      ctx.drawImage(assets[next.file], 0, 0, W, H);
      ctx.globalAlpha = 1;

      const accent = mixColor(current.accent, next.accent, easedT);
      const lightColor = mixColor(current.light, next.light, easedT);
      const lightPower = mix(current.lightPower, next.lightPower, easedT);
      const shadowPower = mix(current.shadowPower, next.shadowPower, easedT);

      paintMaskedColor(assets.lightMask, lightColor, lightPower, 'screen');
      paintMaskedColor(assets.shadowMask, '#071027', shadowPower, 'multiply');
      captureLitBaseScene();
      document.documentElement.style.setProperty('--accent', accent);
      lastLightingUpdate = animationClock;
      litBaseSceneReady = true;
    }

    function render() {
      const hour = getLocalHour();
      // Les grands masters, les masques de lumière et les ombres évoluent à
      // l'échelle de l'heure. Une mise à jour par seconde est visuellement
      // continue et évite plusieurs compositions plein écran à chaque frame.
      if (!litBaseSceneReady || animationClock - lastLightingUpdate >= 1000) {
        rebuildLitBaseScene(hour);
      } else {
        ctx.globalCompositeOperation = 'source-over';
        ctx.globalAlpha = 1;
        ctx.drawImage(baseSceneCanvas, 0, 0);
      }

      const celestials = getCelestials(hour);
      drawAnimatedOcean(hour);
      drawWaterDepthGradient(hour);
      for (const celestial of celestials) paintDirectionalLight(assets.lightMask, celestial);
      for (const celestial of celestials) drawWaterReflection(celestial);
      for (const celestial of celestials) drawCelestialSystem(celestial);
      restoreForegroundLayers();
    }

    function frame(now) {
      // Le MP4 source contient 24 images par seconde. Dessiner le pipeline
      // complet à 60 i/s recalculait les mêmes frames plus de deux fois et
      // surchargeait inutilement le processeur et le GPU.
      if (nextFrameAt === 0) nextFrameAt = now;
      if (now >= nextFrameAt) {
        animationClock = now;
        render();
        nextFrameAt += targetFrameDuration;
        if (now - nextFrameAt > targetFrameDuration) {
          nextFrameAt = now + targetFrameDuration;
        }
      }
      requestAnimationFrame(frame);
    }

    oceanVideo.addEventListener('canplay', () => {
      oceanVideoReady = true;
      syncOceanVideoPlayback();
    });
    oceanVideoRelay.addEventListener('canplay', () => {
      oceanVideoRelayReady = true;
      // Ce lecteur doit rester en lecture lorsqu'il prépare le prochain
      // raccord. L'ancien test le remettait en pause à chaque seconde
      // réutilisation, d'où le gel exactement tous les deux cycles.
      if (
        oceanVideoRelay !== activeOceanVideo
        && !oceanHandoffPending
        && !oceanHandoffActive
      ) {
        oceanVideoRelay.pause();
        oceanVideoRelay.currentTime = 0;
      }
    });
    oceanVideo.addEventListener('error', () => {
      oceanVideoReady = false;
      console.warn('La boucle vidéo de la mer est indisponible ; le rendu statique reste actif.');
    });
    oceanVideoRelay.addEventListener('error', () => {
      oceanVideoRelayReady = false;
      console.warn('Le relais de boucle vidéo est indisponible ; le lecteur principal reste actif.');
    });
    const recoverEndedOceanVideo = event => {
      if (event.currentTarget !== activeOceanVideo || oceanHandoffActive || oceanHandoffPending) return;
      activeOceanVideo.currentTime = 0;
      activeOceanVideo.play().catch(() => {});
    };
    oceanVideo.addEventListener('ended', recoverEndedOceanVideo);
    oceanVideoRelay.addEventListener('ended', recoverEndedOceanVideo);
    reducedMotionQuery.addEventListener('change', syncOceanVideoPlayback);
    window.addEventListener('pointerdown', syncOceanVideoPlayback, { once: true });
    oceanVideo.load();
    oceanVideoRelay.load();

    Promise.all([
      ...states.map(async state => { assets[state.file] = await loadImage(state.file); }),
      loadImage('LIGHT_MASK.png'),
      loadImage('SHADOW_MASK.png'),
      loadImage('SUN_SOURCE.png'),
      loadImage('MOON_MODEL.png'),
      loadImage('WATER_EFFECT_MASK.png'),
      loadImage('layers/MONT.png'),
      loadImage('layers/MONTAGNES.png'),
      loadImage('layers/PREMIER_PLAN.png')
    ]).then(results => {
      // Les pixels d'images locales ne peuvent pas être lus par getImageData
      // depuis file:// (canvas « tainted »). Les masters restent utilisables
      // directement ; les masques calculés sont réservés au mode HTTP/HTTPS.
      assets.lightMask = localFileMode ? null : createLuminanceMask(results[4], false);
      assets.shadowMask = localFileMode ? null : createLuminanceMask(results[5], true);
      assets.sun = results[6];
      assets.moon = results[7];
      assets.mountLayer = results[9];
      assets.foregroundLayer = results[11];
      // Le masque marin d'origine est volontairement large et mord sur le
      // relief. On retranche l'Olympe AVANT de dessiner la vidéo ou les shaders,
      // de sorte qu'aucun effet d'eau ne soit jamais produit sur ce calque.
      const waterWithoutMount = excludeMaskFromLayer(
        results[8],
        assets.mountLayer
      );
      assets.waterMask = excludeMaskFromLayer(
        waterWithoutMount,
        assets.foregroundLayer
      );
      assets.waterEffectMask = assets.waterMask;
      const foregroundWithoutWater = excludeMaskFromLayer(
        assets.foregroundLayer,
        assets.waterMask
      );
      // L'Olympe reste toujours prioritaire : le masque d'eau, volontairement
      // large pour couvrir l'océan, ne doit jamais retrancher sa silhouette.
      assets.sceneForegroundOcclusion = combineAlphaLayers(
        assets.mountLayer,
        foregroundWithoutWater
      );
      // Le PNG contient quelques pixels alpha isolés hors de la bande du
      // relief. Seule la silhouette réellement visible doit occulter l'astre.
      assets.distantMountainsLayer = clipAlphaLayerToBand(
        results[10],
        Math.round(H * 350 / DESIGN_H),
        Math.round(H * 525 / DESIGN_H)
      );
      assets.mountainOcclusion = combineAlphaLayers(
        assets.mountLayer,
        assets.distantMountainsLayer
      );
      assets.mountainSampler = localFileMode ? null : createAlphaSampler(assets.mountainOcclusion);
      loading.classList.add('done');
      requestAnimationFrame(frame);
    }).catch(error => {
      const message = error instanceof Error ? error.message : String(error);
      loading.textContent = `Impossible de charger les sources visuelles — ${message}`;
      console.error(error);
    });
  </script>
</body>
</html>
